name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy pwa/ to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}

          # Copy pwa/ to a temp dir
          cp -r pwa /tmp/pwa-deploy
          touch /tmp/pwa-deploy/.nojekyll

          # Switch to gh-pages branch (create if needed)
          git fetch origin gh-pages 2>/dev/null || true
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages

          # Clear everything and replace with pwa/ contents
          git rm -rf . --quiet 2>/dev/null || true
          cp -r /tmp/pwa-deploy/. .

          git add -A
          git commit -m "Deploy $(date -u '+%Y-%m-%d %H:%M') UTC" --allow-empty
          git push origin gh-pages --force
